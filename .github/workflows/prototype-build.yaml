name: Prototype Build

on:
  # Manual dispatch in the UI, with an optional version input
  workflow_dispatch:
    inputs:
      version:
        description: 'Prototype version label (e.g. 1.2.3-beta.1)'
        required: false

  # Optional: also run on every push to develop
  push:
    branches:
      - develop

jobs:
  build-prototype:
    name: Build & Package Prototype
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint, Test & Circular-check
        run: |
          npm run lint -- --no-fix
          npm run test:unit
          npm run circular-check

      - name: Build
        run: npm run build

      - name: Create prototype ZIP
        run: |
          VERSION=${{ github.event.inputs.version || github.sha }}
          cd dist
          zip -r ../fluidd-prototype-${VERSION}.zip .
        # Expose the ZIP filename to later steps
        id: zip

      - name: Upload prototype artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluidd-prototype-${{ steps.zip.outputs.VERSION }}.zip
          path: fluidd-prototype-${{ steps.zip.outputs.VERSION }}.zip
