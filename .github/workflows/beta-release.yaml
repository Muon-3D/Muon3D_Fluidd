name: BETA RELEASE

# you can manually trigger it, or automatically on develop-branch tags
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Beta version (must start with “v” and include “-beta”)'
        required: true
        default: 'v1.2.0-beta.0'
  push:
    branches:
      - develop
    # optional: only run on “v*-beta*” tags
    #tags:
    #  - 'v*-beta*'

jobs:
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # ensure we’re building from develop
          ref: ${{ github.event.inputs.version && 'develop' || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps & build
        run: |
          npm ci
          npm run lint -- --no-fix
          npm run test:unit
          npm run circular-check
          npm run build

      - name: Package artifact
        run: |
          cd dist
          zip -r ../fluidd-beta.zip .

  release:
    name: Publish Beta Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Create Beta Git tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag ${{ github.event.inputs.version }}
          git push origin ${{ github.event.inputs.version }}

      - name: Create GitHub Release
        id: make_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.version || github.ref }}
          release_name: ${{ github.event.inputs.version || github.ref }}
          body: Prototype/Beta build from develop
          draft: false
          prerelease: true

      - name: Upload Beta Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.make_release.outputs.upload_url }}
          asset_path: ./fluidd-beta.zip
          asset_name: fluidd-beta.zip
          asset_content_type: application/zip
