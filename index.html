<!DOCTYPE html>
<html lang="en" data-m3d-style="glass">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <script>
      /* The theme before anything paints, so the loader is never the wrong
         colour; the wordmark's font flags html.muon-font once it can draw. */
      (function () {
        var html = document.documentElement
        try {
          html.dataset.muonTheme = (localStorage.getItem('muon3d.theme') === 'light' ? 'light' : 'dark')
        } catch (e) {
          html.dataset.muonTheme = 'dark'
        }
        if (document.fonts && document.fonts.load) {
          document.fonts.load('1em "Krona One"').then(function () {
            html.classList.add('muon-font')
          })
        }
        /* config.json is asked for here, as the HTML is parsed, not once the
           1.6 MB entry script has been compiled and run: on a slow phone or
           laptop that took seconds before the first request went out (KAN-2011).
           init.ts takes the answer; if this failed it asks again itself. */
        try {
          if (!/^\/(?:setup|sign-in)(?:\/|$)/.test(window.location.pathname)) {
            window.__muonHostConfig = fetch('%BASE_URL%config.json')
              .then(function (r) { return r.ok ? r.json() : null })
              .catch(function () { return null })
          }
        } catch (e) {}
        /* A head start to the printer and the console. Never on /setup or
           /sign-in: the setup page may reach only the printer (05 §7). */
        try {
          if (!/^\/(?:setup|sign-in)(?:\/|$)/.test(window.location.pathname)) {
            var preconnect = function (url) {
              if (!url) return
              var o = new URL(url, window.location.href)
              if (o.origin === window.location.origin || !/^https?:$/.test(o.protocol)) return
              var l = document.createElement('link')
              l.rel = 'preconnect'
              l.href = o.origin
              l.crossOrigin = 'anonymous'
              document.head.appendChild(l)
            }
            var instances = JSON.parse(localStorage.getItem('appInstances') || '[]')
            for (var i = 0; i < instances.length; i++) {
              if (instances[i] && instances[i].active) { preconnect(instances[i].apiUrl); break }
            }
            // Only where this page's storage can be trusted (KAN-2192): on
            // plain HTTP anything on the network can write it.
            var trusted = location.protocol === 'https:' || ['localhost', '127.0.0.1', '[::1]'].indexOf(location.hostname) !== -1
            if (trusted && localStorage.getItem('muon.cloud.token')) {
              preconnect(localStorage.getItem('muon.cloud.url'))
            }
          }
        } catch (e) {}
      })()
    </script>
    <link rel="preload" href="/fonts/krona-one-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
    <style>
      @font-face {
        font-family: 'Krona One';
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url('/fonts/krona-one-latin-400-normal.woff2') format('woff2');
      }
      /* The glass look from the first frame (KAN-2257): Control's own
         background, text and system font, so nothing changes colour or
         typeface when the app takes over. The values are the glass tokens in
         src/scss/muon3d-glass.scss (--m3d-bg, --m3d-text, --m3d-font-sans). */
      html, body { margin: 0; background: #000; }
      html[data-muon-theme=light], html[data-muon-theme=light] body { background: #f2f2f7; }

      #muon-loader {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        background: #000; color: #f5f5f7;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter Variable', 'Helvetica Neue', Arial, sans-serif;
        --muon-loader-progress: 0;
        --muon-loader-accent: #80d6d1;
        --muon-loader-line: rgb(84 84 88 / 48%);
        --muon-loader-muted: #98989d;
      }
      html[data-muon-theme=light] #muon-loader { background: #f2f2f7; color: #1d1d1f; --muon-loader-accent: #2c8782; --muon-loader-line: rgb(60 60 67 / 13%); --muon-loader-muted: #6e6e73; }
      /* Leaves in three quarters of a fast step, on the exit curve. */
      #muon-loader.muon-loader--gone { opacity: 0; transition: opacity 120ms cubic-bezier(0.4, 0, 1, 1); pointer-events: none; }

      /* The bar fills by transform, not width, so it never lays out a frame. */
      .muon-loader__bar { position: absolute; top: 0; left: 0; right: 0; height: 2px; overflow: hidden; background: color-mix(in srgb, var(--muon-loader-accent) 15%, transparent); }
      .muon-loader__fill {
        position: relative; height: 100%; width: 100%; overflow: hidden;
        background: var(--muon-loader-accent);
        transform: scaleX(var(--muon-loader-progress)); transform-origin: 0 50%;
        transition: transform 240ms cubic-bezier(0.2, 0, 0, 1);
      }
      .muon-loader__fill::after {
        content: ''; position: absolute; inset: 0;
        background: linear-gradient(90deg, transparent 30%, rgb(255 255 255 / 55%) 50%, transparent 70%);
        animation: muon-loader-sheen 1.4s linear infinite;
      }
      @keyframes muon-loader-sheen { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
      @media (prefers-reduced-motion: reduce) { .muon-loader__fill::after { animation: none; opacity: 0; } .muon-loader__fill { transition: none; } }

      /* The drawn wordmark shows until Krona One can; then the real type does. */
      .muon-loader__svg { width: 92px; height: 16px; }
      .muon-loader__span { font-family: 'Krona One'; font-size: 15px; letter-spacing: 0.24em; line-height: 1; visibility: hidden; }
      html.muon-font .muon-loader__svg { display: none; }
      html.muon-font .muon-loader__span { visibility: visible; }
      #muon-loader.muon-loader--cached .muon-loader__word { display: none; }

      .muon-loader__error { position: absolute; bottom: 24px; font: 14px sans-serif; color: inherit; opacity: 0.8; }
      .muon-loader__error a { color: var(--muon-loader-accent); }

      /* The last-known state, drawn in plain DOM while the socket connects. */
      .muon-loader__cached { display: none; position: absolute; inset: 0; padding: 56px 20px 20px; overflow: auto; }
      #muon-loader.muon-loader--cached .muon-loader__cached { display: block; }
      .muon-loader__cached.muon-stale { filter: grayscale(0.5); opacity: 0.55; user-select: none; }
      .muon-loader__printers, .muon-loader__status, .muon-loader__connecting { max-width: 520px; margin-left: auto; margin-right: auto; }
      .muon-loader__printer { display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-bottom: 1px solid var(--muon-loader-line); font-size: 14px; }
      .muon-loader__printer-name { font-weight: 600; }
      .muon-loader__printer-detail { margin-left: auto; font-size: 12px; opacity: 0.7; }
      /* One colour per state, as everywhere else: printing teal, ready green,
         paused amber, fault red, offline grey. */
      .muon-loader__pill { padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; color: var(--muon-loader-muted); background: color-mix(in srgb, currentColor 15%, transparent); }
      .muon-loader__pill--printing { color: var(--muon-loader-accent); }
      .muon-loader__pill--ready { color: rgb(48 209 88); }
      .muon-loader__pill--paused { color: rgb(255 146 48); }
      .muon-loader__pill--error { color: rgb(255 66 69); }
      html[data-muon-theme=light] .muon-loader__pill--ready { color: rgb(0 137 50); }
      html[data-muon-theme=light] .muon-loader__pill--paused { color: rgb(201 52 0); }
      html[data-muon-theme=light] .muon-loader__pill--error { color: rgb(215 0 21); }
      .muon-loader__status-file { font-size: 13px; margin: 16px 0 8px; opacity: 0.9; }
      .muon-loader__progress { height: 3px; border-radius: 2px; overflow: hidden; background: color-mix(in srgb, var(--muon-loader-accent) 15%, transparent); margin: 8px 0; }
      .muon-loader__progress-fill { height: 100%; background: var(--muon-loader-accent); transform-origin: 0 50%; }
      .muon-loader__status-temps { font-size: 13px; opacity: 0.8; margin-top: 12px; }
      .muon-loader__status-when { font-size: 11px; opacity: 0.6; margin-top: 8px; }
      .muon-loader__connecting { display: flex; align-items: center; gap: 10px; margin-top: 18px; font-size: 12px; opacity: 0.8; }
      .muon-loader__connecting-line { position: relative; flex: 1; height: 2px; background: color-mix(in srgb, var(--muon-loader-accent) 15%, transparent); overflow: hidden; }
      .muon-loader__connecting-line::after { content: ''; position: absolute; top: 0; bottom: 0; left: 0; width: 40%; background: var(--muon-loader-accent); animation: muon-loader-indet 1.2s cubic-bezier(0.2, 0, 0, 1) infinite; }
      @keyframes muon-loader-indet { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .muon-loader__connecting-line::after { animation: none; transform: translateX(75%); } }
    </style>
    <title>Muon3D</title>
    <meta name="description" content="The Klipper web interface for managing your 3d printer" />

    <link rel="icon" type="image/png" sizes="32x32" href="/img/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/img/icons/favicon-16x16.png" />
    <meta name="theme-color" content="#2196F3" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Muon3D" />
    <link rel="apple-touch-icon" sizes="180x180" href="/img/icons/apple-touch-icon-180x180.png" />
    <link rel="mask-icon" href="/img/icons/safari-pinned-tab.svg" color="#000000" />
    <meta name="msapplication-TileImage" content="%BASE_URL%img/icons/mstile-150x150.png" />
    <meta name="msapplication-TileColor" content="#000000" />

    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <noscript>
      <strong>We're sorry, but the Muon3D interface doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="muon-loader" role="progressbar" aria-label="Loading Muon3D">
      <div class="muon-loader__bar"><div class="muon-loader__fill"></div></div>
      <div class="muon-loader__word">
        <svg class="muon-loader__svg" viewBox="0 0 92 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2 14 V2 l5 7 5-7 v12" />
          <path d="M18 2 v9 a4 4 0 0 0 8 0 V2" />
          <path d="M32 2 a5 6 0 1 1 0 12 a5 6 0 1 1 0-12" />
          <path d="M42 14 V2 l8 12 V2" />
          <path d="M56 2.5 h6.5 l-4 5 a4.2 4.2 0 1 1 -4.6 4.8" />
          <path d="M70 14 V2 h4 a6 6 0 0 1 0 12 h-4" />
        </svg>
        <span class="muon-loader__span">MUON3D</span>
      </div>
      <div class="muon-loader__cached"></div>
      <p class="muon-loader__error" hidden>Muon3D couldn't load. <a href="">Reload</a></p>
    </div>
    <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
</html>
